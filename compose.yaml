services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ui
      POSTGRES_USER: ui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ui -d ui']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ui:${POSTGRES_PASSWORD}@db:5432/ui
      BIND: 0.0.0.0:8080
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - panel_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: [worker]
    env_file: .env
    environment:
      DATABASE_URL: postgres://ui:${POSTGRES_PASSWORD}@db:5432/ui
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  panel_backups:
